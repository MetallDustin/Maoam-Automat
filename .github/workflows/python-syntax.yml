name: Python tests

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r raspberry_pi/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile raspberry_pi/automaten_server.py
      - run: bash -n raspberry_pi/setup_local_https.sh raspberry_pi/install_pi.sh raspberry_pi/maom-system-action
