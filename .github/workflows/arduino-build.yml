name: Arduino Mega build

on:
  push:
  pull_request:

jobs:
  mega:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli lib install "LiquidCrystal I2C@1.1.2"
      - run: arduino-cli lib install "Servo@1.3.0"
      - run: arduino-cli compile --fqbn arduino:avr:mega arduino_mega/maom_mega
